# Builds the Doxygen pages and publishes them to GitHub Pages on each push to
# main.  The site lands at https://ghoniem.github.io/RadCluster/.
#
# Requires Settings > Pages > Source to be "GitHub Actions".
name: docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  create-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up doxygen
        run: >-
          sudo apt-get update;
          sudo apt-get install -y doxygen graphviz;
      - name: Build documentation
        run: >-
          cd doxygen/;
          doxygen Doxyfile;
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: doxygen/HTML

  deploy-docs:
    needs:
      - create-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
