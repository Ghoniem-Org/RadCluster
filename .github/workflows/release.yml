# Publishes a release and its container image when a v* tag is pushed.
#
# There is no Docker daemon on the development machine this repository is
# maintained from, so the image is built here rather than locally.  Pushing the
# tag is what triggers both jobs:
#
#     git tag -a v2.2.0 -m "..." && git push origin v2.2.0
#
# The image lands at ghcr.io/<owner>/radcluster, which GitHub surfaces as a
# Package attached to the repository.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v2.2.0)'
        required: true

permissions:
  contents: write    # create the Release
  packages: write    # push to ghcr.io

jobs:
  image:
    name: Build and publish the container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve the version
        id: v
        run: echo "version=${GITHUB_REF_NAME#refs/tags/}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The owner segment of a ghcr.io reference must be lowercase; the GitHub
      # account is not, so it cannot be interpolated directly.
      - name: Lowercase the image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/radcluster" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.v.outputs.version }}
            ${{ steps.img.outputs.name }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the published image runs on a machine that is not the one that
      # built it, and that the solver binary is not tied to the builder's CPU.
      - name: Smoke-test the published image
        run: |
          IMG='${{ steps.img.outputs.name }}:${{ steps.v.outputs.version }}'
          docker run --rm "$IMG" python3 codes/Python_Testing/check_eurofer_rag.py
          docker run --rm "$IMG" sh -c 'command -v solver'

  release:
    name: Create the GitHub Release
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Create the release from the tag's annotation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME#refs/tags/}"
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          # The annotated tag message is the release notes -- written once, at
          # tag time, rather than duplicated here and allowed to drift.
          git tag -l --format='%(contents)' "$TAG" > notes.md
          {
            echo
            echo '---'
            echo
            echo '### Container image'
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${OWNER_LC}/radcluster:${TAG}"
            echo "docker run --rm -it ghcr.io/${OWNER_LC}/radcluster"
            echo '```'
          } >> notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
